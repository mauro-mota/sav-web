<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dobra — Acesso demonstrativo</title>
  <link rel="stylesheet" href="../demo-navigation.css">
  <link rel="stylesheet" href="../acesso.css">
  <link rel="stylesheet" href="dobra.css">
  <script src="../acesso.js" defer></script>
</head>
<body>
  <nav class="demo-return-bar" aria-label="Savannah Hub"><span>Savannah Hub</span><a href="../../index.html#solucoes">Voltar às soluções</a></nav>
  <main class="access-page press">
    <section class="artboard" aria-labelledby="dobra-name">
      <header><h1 id="dobra-name">dobra<span aria-hidden="true"></span></h1><p>Gráfica<br>de bairro</p></header>
      <div class="proof-table"><figure class="print-sheet">
        <div class="crop-marks" aria-hidden="true"></div>
        <figcaption>Agulha Discos apresenta</figcaption>
        <div class="poster-title">Feira<br>do vinil</div><div class="vinyl" aria-hidden="true"></div>
        <footer><span>Cartaz A3</span><span>Agulha Discos</span></footer>
      </figure></div>
      <div class="swatch-key"><span class="ink-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Prova de impressão</div>
    </section>
    <section class="print-order">
      <div class="order-num"><span>Controle de produção</span><i aria-hidden="true"></i></div>
      <div class="typeset"><p>Balcão de pedidos</p><h2>Entrada<br> da equipe</h2></div>
      <form class="login" id="access-form" data-target="../grafica.html" autocomplete="off">
        <label>Usuário<input id="user" type="email" value="producao@dobra.example" required spellcheck="false" autocapitalize="none" autocomplete="off"></label>
        <label>Senha<input id="password" type="password" value="demo123" required autocomplete="off"></label>
        <p class="access-error" role="alert" hidden></p>
        <button class="enter" type="submit">Acessar produção</button>
        <small class="demo-note">Acesso demonstrativo com dados de exemplo.</small>
      </form>
      <div class="paper-foot"><span>Oficina gráfica</span><span>Orçamentos e tiragens</span></div>
    </section>
  </main>
</body>
</html>
