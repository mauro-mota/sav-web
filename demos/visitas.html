<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vão — Agenda de visitas</title>
    <link rel="stylesheet" href="balcao.css" />
    <link rel="stylesheet" href="visitas.css" />
    <script src="balcao.js" defer></script>
    <script src="visitas.js" defer></script>
    <link rel="stylesheet" href="demo-navigation.css" />
  </head>
  <body>
    <div class="demo-return-bar"><span>Savannah Hub</span><a href="../index.html#solucoes">Voltar às soluções</a></div>
    <main>
      <header>
        <div class="vao">vão<small>imóveis</small></div>
        <span>Atendimento imobiliário</span>
      </header>
      <div class="notice" id="notice" hidden>
        <span role="status"></span
        ><button type="button" hidden>Desfazer</button>
      </div>
      <div class="visit-layout">
        <section class="agenda">
          <div class="between">
            <h1>Agenda de visitas</h1>
            <button id="new-visit" class="primary">Agendar visita</button>
          </div>
          <div class="datebar">
            <button id="prev" aria-label="Dia anterior">‹</button
            ><label
              ><span id="calendar-label"></span
              ><input
                type="date"
                id="day"
                required
                aria-label="Dia da agenda" /></label
            ><button id="next" aria-label="Próximo dia">›</button>
          </div>
          <ul id="appointments"></ul>
          <p class="empty" id="no-visits" hidden>Nenhuma visita neste dia.</p>
        </section>
        <section class="property">
          <div class="prop-title">
            <small>Imóvel em atendimento</small
            ><select id="property" aria-label="Ver planta do imóvel"></select>
          </div>
          <canvas
            id="floorplan"
            width="640"
            height="424"
            role="img"
            aria-label="Planta esquemática do imóvel selecionado"
          ></canvas>
          <div class="specs">
            <span id="rooms"></span><span id="area"></span
            ><span id="price"></span>
          </div>
        </section>
      </div>
      <div class="next-moves">
        <div class="between">
          <h2>Retornos comerciais</h2>
          <span id="returns-count"></span>
        </div>
        <ul id="returns"></ul>
      </div>
      <dialog id="visit" aria-labelledby="visit-heading">
        <form>
          <div class="between">
            <h2 id="visit-heading" tabindex="-1">Agendar visita</h2>
            <button type="button" data-close aria-label="Fechar">×</button>
          </div>
          <label
            >Cliente<input
              name="client"
              type="text"
              required
              maxlength="70" /></label
          ><label>Imóvel<select name="property"></select></label>
          <div class="two">
            <label>Data<input name="day" type="date" required /></label
            ><label>Horário<select name="time"></select></label>
          </div>
          <label
            >Corretor<select name="agent">
              <option>Inês</option>
              <option>Pedro</option>
            </select></label
          ><label
            >Situação<select name="stage">
              <option value="visit">Visita agendada</option>
              <option value="follow">Retorno pendente</option>
              <option value="proposta">Proposta enviada</option>
              <option value="ganha">Negócio fechado</option>
              <option value="perdida">Atendimento encerrado</option>
            </select></label
          >
          <p class="error" role="status" id="visit-error"></p>
          <div class="actions">
            <button type="button" class="danger">Excluir visita</button
            ><button type="submit" class="primary">Salvar visita</button>
          </div>
        </form>
      </dialog>
    </main>
    <footer>
      <span>Vão · Demonstração com dados fictícios</span
      ><a href="../index.html#solucoes">Voltar às soluções</a>
    </footer>
  </body>
</html>
